<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduStudy — Boshqaruv paneli</title>
<style>
  :root{
    --navy:#12213F;
    --navy-soft:#1B2E52;
    --paper:#F6F5F1;
    --card:#FFFFFF;
    --ink:#1D2333;
    --ink-soft:#6B7280;
    --line:#E7E5DE;
    --gold:#D89A3E;
    --gold-soft:#F4E3C4;
    --teal:#2E7D6B;
    --red:#C0533E;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--paper);
    color:var(--ink);
    display:flex;
    min-height:100vh;
  }
  h1,h2,h3,.brand,.stat-num{
    font-family:'Manrope','Inter',sans-serif;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:250px;
    flex-shrink:0;
    background:var(--navy);
    color:#DCE3F0;
    display:flex;
    flex-direction:column;
    padding:28px 18px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 6px 28px 6px;
    color:#fff;
  }
  .brand .mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(135deg,var(--gold),#B97A2A);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:16px;color:var(--navy);
  }
  .brand .name{font-size:17px;font-weight:800;letter-spacing:.2px;}
  .brand .sub{font-size:10.5px;color:#8FA0C4;font-weight:500;}

  nav{display:flex;flex-direction:column;gap:2px;margin-top:6px;}
  .nav-item{
    display:flex;align-items:center;gap:12px;
    padding:10px 12px;border-radius:8px;
    font-size:14px;font-weight:500;color:#B7C2DC;
    text-decoration:none;
    transition:background .15s ease, color .15s ease;
  }
  .nav-item svg{width:18px;height:18px;flex-shrink:0;}
  .nav-item:hover{background:var(--navy-soft);color:#fff;}
  .nav-item.active{background:var(--gold);color:var(--navy);font-weight:700;}

  .nav-group-label{
    font-size:10.5px;color:#6E7DA0;font-weight:700;
    letter-spacing:.4px;margin:18px 12px 6px 12px;
  }

  .sidebar-foot{
    margin-top:auto;
    background:var(--navy-soft);
    border-radius:var(--radius);
    padding:16px;
  }
  .sidebar-foot p{font-size:13px;font-weight:700;color:#fff;}
  .sidebar-foot span{font-size:12px;color:#E39B7A;display:block;margin-top:2px;}
  .sidebar-foot button{
    margin-top:12px;width:100%;
    background:var(--gold);color:var(--navy);
    border:none;border-radius:7px;
    padding:9px 0;font-weight:700;font-size:13px;
    cursor:pointer;
  }

  /* ---------- MAIN ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}

  .topbar{
    display:flex;align-items:center;gap:16px;
    padding:18px 32px;
    border-bottom:1px solid var(--line);
    background:var(--card);
  }
  .search{
    flex:1;max-width:380px;
    display:flex;align-items:center;gap:9px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;padding:9px 13px;
    color:var(--ink-soft);font-size:13.5px;
  }
  .search svg{width:15px;height:15px;flex-shrink:0;}
  .topbar-spacer{flex:1;}
  .pill{
    display:flex;align-items:center;gap:8px;
    border:1px solid var(--line);border-radius:8px;
    padding:8px 12px;font-size:13px;font-weight:600;
    color:var(--ink);background:var(--card);
  }
  .icon-btn{
    width:36px;height:36px;border-radius:8px;
    border:1px solid var(--line);background:var(--card);
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);cursor:pointer;position:relative;
  }
  .icon-btn svg{width:16px;height:16px;}
  .badge{
    position:absolute;top:-5px;right:-5px;
    background:var(--red);color:#fff;font-size:9.5px;font-weight:700;
    width:16px;height:16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .avatar{
    width:36px;height:36px;border-radius:8px;
    background:var(--navy);color:#fff;font-weight:700;font-size:13px;
    display:flex;align-items:center;justify-content:center;
  }

  .content{padding:28px 32px 40px 32px;}

  /* ---------- STAT CARDS ---------- */
  .stat-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;margin-bottom:24px;
  }
  .stat-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 16px;
    display:flex;flex-direction:column;gap:10px;
  }
  .stat-card .ico{
    width:34px;height:34px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
  }
  .stat-card .ico svg{width:17px;height:17px;}
  .ico.blue{background:#E4EAF7;color:var(--navy);}
  .ico.gold{background:var(--gold-soft);color:#9A6A1D;}
  .ico.teal{background:#DFEFEA;color:var(--teal);}
  .ico.red{background:#F5E2DD;color:var(--red);}
  .stat-label{font-size:12.5px;color:var(--ink-soft);font-weight:600;}
  .stat-num{font-size:26px;font-weight:800;color:var(--ink);}

  /* ---------- CHART CARD ---------- */
  .chart-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 26px 10px 26px;
    margin-bottom:20px;
  }
  .chart-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:18px;
  }
  .chart-head h2{font-size:16.5px;font-weight:800;}
  .year-select{
    border:1px solid var(--line);border-radius:7px;
    padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink);
    background:var(--paper);
  }
  .chart-wrap{width:100%;overflow-x:auto;}
  .chart-wrap svg{width:100%;height:auto;display:block;}

  /* ---------- SCHEDULE ---------- */
  .schedule-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 26px;
  }
  .schedule-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:16px;
  }
  .schedule-head h2{font-size:16.5px;font-weight:800;}
  .tab{
    font-size:12px;font-weight:700;color:var(--ink-soft);
    background:var(--paper);border:1px solid var(--line);
    border-radius:7px;padding:7px 14px;
  }
  table{width:100%;border-collapse:collapse;}
  th{
    text-align:left;font-size:11.5px;color:var(--ink-soft);
    font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);
  }
  td{
    font-size:13.5px;padding:12px 10px;border-bottom:1px solid var(--line);
    color:var(--ink);
  }
  .group-tag{
    display:inline-block;padding:4px 9px;border-radius:6px;
    font-size:11.5px;font-weight:700;
  }
  .group-tag.gold{background:var(--gold-soft);color:#9A6A1D;}
  .group-tag.teal{background:#DFEFEA;color:var(--teal);}

  @media (max-width:1100px){
    .stat-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">ES</div>
      <div>
        <div class="name">EduStudy</div>

      </div>
    </div>

    <nav>
      <a class="nav-item active" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        Asosiy

      <a class="nav-item" href="{% url 'login' %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>

      </a>
       <a class="nav-item" href="{% url 'teacher_profile' %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.9 3.1-6.5 7-6.5s7 2.6 7 6.5"/></svg>

       <a class="nav-item" href="{% url 'get_my_groups' %}">

      </a>

      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.9 3.1-6.5 7-6.5s7 2.6 7 6.5"/></svg>

      </a>





      <div class="nav-group-label">YORDAM</div>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 3 2 10.5l7 3 2 7L22 3Z"/></svg>

      </a>
    </nav>

    <div class="sidebar-foot">
      <p>Obuna</p>
      <span>Obunangiz tugagan</span>

  <!-- ================= MAIN ================= -->
  <div class="main">

    <header class="topbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>

      </div>

      <div class="pill">EduStudy</div>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2Z"/><path d="M18 16v-5a6 6 0 0 0-4-5.7V4a2 2 0 0 0-4 0v1.3A6 6 0 0 0 6 11v5l-2 2v1h16v-1l-2-2Z"/></svg>
        <span class="badge">2</span>

</body>
</html>
